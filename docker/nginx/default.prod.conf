server {
    listen 80;
    server_name contract-mirror.getnexora.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name contract-mirror.getnexora.dev;

    root /var/www/html/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/contract-mirror.getnexora.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contract-mirror.getnexora.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
