services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: contractmirror_php
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            APP_ENV: ${APP_ENV:-dev}
            APP_SECRET: ${APP_SECRET:-change-me}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
            DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
        depends_on:
            database:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        container_name: contractmirror_nginx
        ports:
            - "8090:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    database:
        image: postgres:${POSTGRES_VERSION:-16}-alpine
        container_name: contractmirror_database
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
            POSTGRES_USER: ${POSTGRES_USER:-app}
        ports:
            - "5442:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw

volumes:
    database_data:
